# =============================================================
# PAFS - Perks & Attributes for Sale
# =============================================================

# 1. Quantity Modifier
Vendors.PAFS_StockModifier:
  $base: Vendors.Always_Present
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  value: 60

# Backward compatibility alias for existing saves
Vendors.MyStackOf200:
  $base: Vendors.Always_Present
  $type: gamedataConstantStatModifier_Record
  modifierType: Additive
  value: 60

# 2. Custom Perk Shard
Items.PAFS_PerkShard:
  $base: Items.IKPerkPointSkillbook
  isSingleInstance: True
  statModifierGroups: []
  tags:
    - Preload
    - Consumable
    - skillbook
    - SkipActivityLogOnRemove
    - DontShowLooted
    - PerkSkillbook
    - LargeSkillbook

# Backward compatibility alias
Items.Custom_Infinite_PerkShard:
  $base: Items.PAFS_PerkShard

# 3. Custom Attribute Shard
Items.PAFS_AttributeShard:
  $base: Items.AttributePointSkillbook
  isSingleInstance: True
  statModifierGroups: []
  tags:
    - Preload
    - Consumable
    - skillbook
    - SkipActivityLogOnRemove
    - DontShowLooted
    - PerkSkillbook
    - LargeSkillbook

# Backward compatibility alias
Items.Custom_Infinite_AttributeShard:
  $base: Items.PAFS_AttributeShard

# 4. Custom Permanent Health Food
Items.PAFS_HealthFood:
  $base: Items.PermanentHealthFood
  isSingleInstance: True
  tags:
    - Preload
    - Consumable
    - Edible
    - HasModel
    - Food
    - SkipActivityLog
    - DontShowLooted

# Backward compatibility alias
Items.Custom_Infinite_HealthFood:
  $base: Items.PAFS_HealthFood

# 5. Shared Vendor Items
Vendors.PAFS_VendorItem_PerkShard:
  $type: VendorItem
  item: Items.PAFS_PerkShard
  quantity: [ Vendors.PAFS_StockModifier ]

Vendors.PAFS_VendorItem_AttributeShard:
  $type: VendorItem
  item: Items.PAFS_AttributeShard
  quantity: [ Vendors.PAFS_StockModifier ]

Vendors.PAFS_VendorItem_HealthFood:
  $type: VendorItem
  item: Items.PAFS_HealthFood
  quantity: [ Vendors.PAFS_StockModifier ]

# Backward compatibility aliases for vendor stubs
Vendors.Custom_VendorItem_PerkShard:
  $base: Vendors.PAFS_VendorItem_PerkShard
Vendors.Custom_VendorItem_AttributeShard:
  $base: Vendors.PAFS_VendorItem_AttributeShard
Vendors.Custom_VendorItem_HealthFood:
  $base: Vendors.PAFS_VendorItem_HealthFood

